<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Horizons Adventures</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; color: #333; }
        h1 { color: #1b4332; }
        .controls { margin-bottom: 30px; display: flex; gap: 10px; align-items: center; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background: #2d6a4f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #1b4332; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #52b788; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card h3 { margin: 0 0 10px 0; color: #1b4332; }
        .price { font-size: 18px; font-weight: bold; color: #2d6a4f; margin-top: 10px; }
        .badge { display: inline-block; padding: 3px 8px; background: #e8f5e9; color: #2e7d32; border-radius: 12px; font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>🌿 Wild Horizons Tour Explorer</h1>
    <p>Find your next great escape. Powered by your live Node.js REST API!</p>

    <div class="controls">
        <label for="maxPrice">Maximum Budget ($): </label>
        <input type="number" id="maxPrice" placeholder="e.g. 400" />
        <button id="filterBtn">Apply Price Filter</button>
        <button id="resetBtn" style="background-color: #6c757d;">Reset</button>
    </div>

    <div id="toursGrid" class="grid">
        <!-- Tour cards will be injected here dynamically -->
    </div>

    <script src="app.js"></script>
</body>
</html>
